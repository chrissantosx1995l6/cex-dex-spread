name: update-docs

on:
  schedule:
    - cron: "29 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refresh
        run: |
          set -eu
          sleep $(( RANDOM % 900 ))
          f="README.md"
          [ -f "$f" ] || exit 0
          stamp="<!-- refreshed: $(date -u +%Y-%m-%d) -->"
          if grep -q "^<!-- refreshed: " "$f"; then
            sed -i "s|^<!-- refreshed: .*|$stamp|" "$f"
          else
            printf '\n%s\n' "$stamp" >> "$f"
          fi

      - name: commit
        run: |
          set -eu
          git config user.name "chrissantosx1995l6"
          git config user.email "279168720+chrissantosx1995l6@users.noreply.github.com"
          set -- "chore: scheduled refresh" "chore: refresh metadata" "docs: touch up" "docs: update generated marker" "chore: housekeeping"
          n=$(( ${GITHUB_RUN_NUMBER:-0} % $# + 1 ))
          eval msg=\${$n}
          git add -- "README.md"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$msg"
          git push
